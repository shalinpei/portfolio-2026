<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shalin Pei</title>
<meta name="description" content="Shalin Pei is a Brooklyn-based design executive who led design at Coinbase, Facebook, and Google. Currently on sabbatical, writing, advising, and exploring side quests.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Shalin Pei">
<meta property="og:description" content="Brooklyn-based design executive. Currently on sabbatical, writing, advising, and exploring side quests.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shalinpei.com/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Satoshi", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 34rem; }
  .name {
    font-family: "Space Mono", ui-monospace, monospace;
    font-style: italic;
    font-weight: 700;
    font-size: 2em;
    letter-spacing: -0.05em;
    line-height: 1.15;
    margin: 0 0 0.3em;
  }
  p { margin: 0 0 1.5rem; }
  a { color: inherit; }
  footer { margin-top: 2.5rem; font-size: 0.9rem; }
  footer a { margin-right: 1.25rem; }
  footer a:last-child { margin-right: 0; }
</style>
</head>
<body>
<main>
  <h1 class="name">Shalin Pei</h1>
  <p>is a Brooklyn-based design executive who led design at Coinbase, Facebook, and Google. She is currently <a href="https://lnkd.in/p/gjH6TfU7">on sabbatical</a>, writing, advising, and exploring side quests.</p>
  <footer>
    <span id="email-link"></span>
    <a href="https://www.linkedin.com/in/shalinpei" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://medium.com/@shalinpei" target="_blank" rel="noopener">Medium</a>
    <a href="https://instagram.com/shalinpei" target="_blank" rel="noopener">Instagram</a>
  </footer>
</main>
<script>
(function () {
  // Email address assembled at runtime so scrapers reading the HTML source
  // never see a plain "user@domain" string or a mailto: link.
  var user = "me";
  var domain = "shalinpei" + "." + "com";
  var at = String.fromCharCode(64); // "@"
  var address = user + at + domain;
  var slot = document.getElementById("email-link");
  if (!slot) return;
  var a = document.createElement("a");
  a.setAttribute("href", "mai" + "lto" + ":" + address);
  a.textContent = "Email";
  slot.appendChild(a);
})();
</script>
<noscript><span>me [at] shalinpei [dot] com</span></noscript>
</body>
</html>
